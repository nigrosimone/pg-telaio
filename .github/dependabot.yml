version: 2

updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
      commit-message:
          prefix: "chore(deps)"

    - package-ecosystem: npm
      directory: /
      schedule:
          interval: monthly
      commit-message:
          # the changelog and the version bump are generated from the commit subjects, so the
          # prefixes have to stay conventional
          prefix: "chore(deps)"
          prefix-development: "chore(deps-dev)"
      groups:
          # everything else arrives as one pull request a month rather than fifteen. pg comes on
          # its own: it is the driver everything here sits on, and its pull request runs the
          # integration suite against the new version, which is the point of letting it through.
          development:
              dependency-type: development
              exclude-patterns:
                  - pg
                  - "@types/pg"
      # The peer range, pg >=8.23.0, is not maintained here: it is a compatibility statement, and
      # only a test run against a new pg can widen or raise it. Dependabot moves the devDependency,
      # which is what the suites run against.
